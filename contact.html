<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Christine Joy Espiritu</title>
  <meta name="description" content="Contact Christine Joy Espiritu.">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html" aria-label="Tinapay home">
      <img
        src="images/tinapay_logo.png"
        alt="Tinapay"
      >
      </a>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="articles.html">Articles</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <p class="eyebrow">Let’s connect</p>
      <h1>Contact Me</h1>
      <p>Send me a message and I will get back to you as soon as I can.</p>
    </section>

    <section class="contact-section">
      <form action="#" method="post">
        <p>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </p>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Christine Joy Espiritu. All rights reserved.</p>
  </footer>
</body>
</html>
