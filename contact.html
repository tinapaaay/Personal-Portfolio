<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    rel="stylesheet"
  >
  <title>Contact | Christine Joy Espiritu</title>
  <meta name="description" content="Contact Christine Joy Espiritu.">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="logo" href="index.html" aria-label="Tinapay home">
      <img
        src="images/tinapay_logo.png"
        alt="Tinapay"
      >
      </a>

      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="articles.html">Articles</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <p class="eyebrow">Let’s connect</p>
      <h1>Contact Me</h1>
      <p>Send me a message and I will get back to you as soon as I can.</p>
    </section>

    <section class="contact-section">
      <form action="#" method="post">
        <p>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="7" required></textarea>
        </p>

        <button type="submit">Send Message</button>
      </form>
    </section>
    <section class="social-section" aria-labelledby="social-heading">
      <p class="eyebrow">Elsewhere online</p>
      <h2 id="social-heading">Find me online</h2>

      <div class="social-links">
        <a
          href="https://www.linkedin.com/in/tinapay/"
          target="_blank"
          rel="noopener"
        >
          LinkedIn <span aria-hidden="true">↗</span>
        </a>

        <a
          href="https://github.com/tinapaaay"
          target="_blank"
          rel="noopener"
        >
          GitHub <span aria-hidden="true">↗</span>
        </a>

        <a
          href="https://www.instagram.com/_tina_pay/"
          target="_blank"
          rel="noopener"
        >
          Instagram <span aria-hidden="true">↗</span>
        </a>

        <a
          href="https://www.facebook.com/01eyojenitsirhc/"
          target="_blank"
          rel="noopener"
        >
          Facebook <span aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Christine Joy Espiritu. All rights reserved.</p>
  </footer>
</body>
</html>
